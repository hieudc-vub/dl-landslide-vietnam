name: Windows CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: python -m pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run functional and arithmetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Check README languages and local documentation links
        run: python scripts/check_docs.py
